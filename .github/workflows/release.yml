name: Release

on:
  push:
    branches: [main]

jobs:
  release-please:
    permissions:
      contents: write
      pull-requests: write
      issues: write # release-please manages labels (autorelease: pending/tagged)
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Built-in token. Requires "Allow GitHub Actions to create and approve pull requests"
          # (Settings > Actions > General). Note: PRs opened with GITHUB_TOKEN do not trigger
          # other workflows, so CI won't run automatically on the release PR.
          token: ${{ secrets.GITHUB_TOKEN }}

  # One native addon (`domainlint.<platform>.node`) per supported platform. Each is published
  # as its own `domainlint-binding-<platform>` package (see packages/domainlint/npm/) that
  # `domainlint` loads through `native/binding.cjs`.
  build-native:
    name: build ${{ matrix.target }}
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          # glibc: napi-rs' prebuilt gcc toolchain targets glibc 2.17, so the binary
          # runs on old distros even though it is built on a recent runner.
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            build-flags: --use-napi-cross
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            build-flags: --use-napi-cross
          # musl (Alpine): cross compiled with cargo-zigbuild (installed by napi on first use).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            build-flags: -x
            zig: true
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            build-flags: -x
            zig: true
          # macos-latest is arm64; the x64 binary is cross compiled by the same Xcode toolchain.
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
        with:
          version: 0.13.0
      - run: pnpm install --frozen-lockfile --filter domainlint
      - name: Build addon
        run: pnpm --filter domainlint run build:native --target ${{ matrix.target }} ${{ matrix.build-flags }}
      - uses: actions/upload-artifact@v4
        with:
          name: bindings-${{ matrix.target }}
          path: packages/domainlint/native/*.node
          if-no-files-found: error
      # binding.cjs / binding.d.ts are generated by the build and identical on every platform:
      # keep one copy for the main package.
      - uses: actions/upload-artifact@v4
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        with:
          name: binding-js
          path: |
            packages/domainlint/native/binding.cjs
            packages/domainlint/native/binding.d.ts
          if-no-files-found: error

  publish:
    needs: [release-please, build-native]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships npm 10.
      - run: npm install --global npm@11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter domainlint build

      - uses: actions/download-artifact@v4
        with:
          pattern: bindings-*
          path: packages/domainlint/artifacts
      - uses: actions/download-artifact@v4
        with:
          name: binding-js
          path: packages/domainlint/native

      # Moves each `domainlint.<platform>.node` into npm/<platform>/ (and fails if one of the
      # configured targets is missing).
      - name: Collect addons into the platform packages
        working-directory: packages/domainlint
        run: pnpm exec napi artifacts --output-dir artifacts --npm-dir npm

      # NOTE: the first publish of each new `domainlint-binding-*` package cannot use OIDC: npm
      # only lets you configure a trusted publisher (npmjs.com > package > Settings) on a package
      # that already exists. Publish 0.x of each of the 7 packages once by hand
      # (`npm publish --access public` in packages/domainlint/npm/<platform>/), then add this
      # repository + `release.yml` as trusted publisher of every one of them.
      - name: Publish platform packages
        working-directory: packages/domainlint
        run: |
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            version=$(node -p "require('./${dir}package.json').version")
            if [ -n "$(npm view "${name}@${version}" version 2>/dev/null)" ]; then
              echo "${name}@${version} is already published, skipping"
              continue
            fi
            (cd "$dir" && npm publish --provenance --access public)
          done

      # Pin `domainlint-binding-*` as optionalDependencies of the main package (not committed,
      # see the script) and publish it with native/binding.cjs + binding.d.ts in its tarball.
      - run: node packages/domainlint/scripts/inject-optional-deps.mjs
      - run: pnpm --filter domainlint publish --no-git-checks --provenance
