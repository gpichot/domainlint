name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Rust format
        run: cargo fmt --all --check
      - name: Rust lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests
        run: cargo test --workspace
      # The tests load the native addon (packages/domainlint/native/*.node)
      - name: Build native addon
        run: pnpm --filter domainlint build:native
      - run: pnpm --filter domainlint build
      - run: pnpm --filter domainlint test:coverage
      - name: Write coverage summary
        run: |
          node -e "
            const s = require('./packages/domainlint/coverage/coverage-summary.json').total;
            const fmt = v => v.pct + '% (' + v.covered + '/' + v.total + ')';
            const rows = [
              '| Metric | Coverage |',
              '|--------|----------|',
              '| Lines | ' + fmt(s.lines) + ' |',
              '| Statements | ' + fmt(s.statements) + ' |',
              '| Functions | ' + fmt(s.functions) + ' |',
              '| Branches | ' + fmt(s.branches) + ' |',
            ];
            const out = '## Coverage\n\n' + rows.join('\n') + '\n';
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, out);
          "

  # Builds the addon natively and runs the vitest suite on each OS. Mainly
  # catches path-separator bugs (Windows) and per-platform build problems.
  native-smoke:
    name: native (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # The JS test suite was written on POSIX (memfs fixtures with '/project'
    # paths): Windows is advisory until it has been seen green once, then drop
    # this line to make it required.
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build native addon
        run: pnpm --filter domainlint build:native
      - run: pnpm --filter domainlint build
      - run: pnpm --filter domainlint test:run
