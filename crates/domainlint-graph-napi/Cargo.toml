[package]
name = "domainlint-graph-napi"
version = "0.1.0"
edition = "2024"
publish = false
description = "napi-rs binding spike over domainlint-graph (measures JS<->Rust boundary cost)"

[lib]
crate-type = ["cdylib"]

[dependencies]
domainlint-graph = { path = "../domainlint-graph" }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# panic = "abort" would abort the Node process on a Rust panic; keep unwind for the addon.
