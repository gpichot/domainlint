[package]
name = "domainlint-graph-napi"
version = "0.1.0"
edition = "2024"
publish = false
description = "napi-rs binding for domainlint: native import graph + built-in rules"

[lib]
crate-type = ["cdylib"]

[dependencies]
domainlint-graph = { path = "../domainlint-graph" }
napi = { version = "3", default-features = false, features = ["napi4"] }
napi-derive = "3"

[build-dependencies]
napi-build = "2"
