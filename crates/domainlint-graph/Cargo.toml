[package]
name = "domainlint-graph"
version = "0.1.0"
edition = "2024"
description = "Native (Rust) import-graph build + built-in domainlint rules; performance spike"
publish = false

[lib]
name = "domainlint_graph"
path = "src/lib.rs"

[[bin]]
name = "domainlint-rs"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4", features = ["derive"] }
globset = "0.4.21"
ignore = "0.4.34"
json_comments = "0.2.2"
memchr = "2.8.3"
oxc_allocator = "0.158.0"
oxc_parser = "0.158.0"
oxc_resolver = "11.24.3"
oxc_span = "0.158.0"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
