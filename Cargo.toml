[workspace]
resolver = "3"
members = ["crates/domainlint-graph", "crates/domainlint-graph-napi"]

# `panic` cannot be set per package in a workspace profile, so the shared release profile keeps the
# default (unwind): `panic = "abort"` would kill the Node process on a Rust panic in the addon.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
